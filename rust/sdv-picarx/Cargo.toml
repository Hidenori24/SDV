[package]
name = "sdv-picarx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PiCar-X platform adapter for SDV virtual ECU tasks"

[dependencies]
sdv-core = { path = "../sdv-core" }

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[[bin]]
name = "sdv-picarx"
path = "src/main.rs"
