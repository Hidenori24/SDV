[package]
name = "sdv-fota"
version = "0.1.0"
edition = "2021"
description = "Platform-independent FOTA package validation and update interfaces"
license = "MIT"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sdv-sec = { path = "../sdv-sec" }

[dev-dependencies]
sdv-sec = { path = "../sdv-sec", features = ["sign"] }

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "sdv-sec/std"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "sdv-fota-launcher"
path = "src/bin/sdv-fota-launcher.rs"
required-features = ["std"]

[[bin]]
name = "sdv-fota"
path = "src/bin/sdv-fota.rs"
required-features = ["std"]
