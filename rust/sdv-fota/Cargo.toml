[package]
name = "sdv-fota"
version = "0.1.0"
edition = "2021"
description = "Platform-independent FOTA package validation and update interfaces"
license = "MIT"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }
libc = { version = "0.2", default-features = false, optional = true }
sdv-sec = { path = "../sdv-sec" }

[dev-dependencies]
sdv-sec = { path = "../sdv-sec", features = ["sign"] }

[features]
default = ["std"]
std = ["serde/std", "dep:serde_json", "dep:libc", "sdv-sec/std"]
host-signing = ["sdv-sec/sign"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "sdv-fota-launcher"
path = "src/bin/sdv-fota-launcher.rs"
required-features = ["std"]

[[bin]]
name = "sdv-fota"
path = "src/bin/sdv-fota.rs"
required-features = ["std"]

[[bin]]
name = "sdv-fota-sign"
path = "src/bin/sdv-fota-sign.rs"
required-features = ["std", "host-signing"]
