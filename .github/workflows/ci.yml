name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests:
    name: cpp-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: ctest (C/C++ unit tests)
        run: ctest --test-dir build --output-on-failure
      - name: Run simulator and keep log
        run: |
          mkdir -p logs out
          ./build/sdv_sim
          cp logs/latest.csv out/latest.csv
          ./build/sdv_sim --stall brake:2
          cp logs/latest.csv out/cpp_stall_brake2.csv
          ./build/sdv_sim --stall steering:3 --stall brake:3.5
          cp logs/latest.csv out/cpp_stall_steering3_brake3.5.csv
          ./build/sdv_sim --stall engine:1 --stall vehicledynamics:2
          cp logs/latest.csv out/cpp_stall_engine1_vd2.csv
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-sim-log
          path: out/*.csv

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/sdv-core
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test (includes C++ golden log cross-check)
        run: cargo test
      - name: cargo test (FOTA service and Pi 5/Linux backend)
        run: cargo test --manifest-path ../sdv-fota/Cargo.toml
      - name: WASM build
        run: cargo build --release --target wasm32-unknown-unknown

  sec-tests:
    name: sec-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/sdv-sec
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test (RFC / NIST test vectors, frame MAC, header check)
        run: cargo test --features sign
      - name: no_std build for the browser target (no signing code)
        run: cargo build --release --target wasm32-unknown-unknown
      - name: C ABI smoke test (a C program through the public header)
        run: ./tests/c_smoke.sh

  integration:
    name: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the WASM artifact
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path rust/sdv-core/Cargo.toml
      - name: Scenario + expectation tests on the built .wasm (Node, no browser)
        run: node tests/integration/run_wasm.mjs

  golden-log:
    name: golden-log
    needs: cpp-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: cpp-sim-log
          path: out
      - name: C++ log must match committed golden file
        run: |
          status=0
          diff -u rust/sdv-core/tests/golden/cpp_latest.csv out/latest.csv || status=1
          for f in cpp_stall_brake2 cpp_stall_steering3_brake3.5 cpp_stall_engine1_vd2; do
            diff -u rust/sdv-core/tests/golden/$f.csv out/$f.csv || status=1
          done
          if [ $status -ne 0 ]; then
            echo "::error::C++ output changed. If intended, regenerate the golden files in rust/sdv-core/tests/golden (see CONTRIBUTING.md)."
            exit 1
          fi

  # Single stable check to require in branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [cpp-tests, rust-tests, sec-tests, integration, golden-log]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
