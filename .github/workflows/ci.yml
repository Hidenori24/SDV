name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests:
    name: cpp-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: ctest (C/C++ unit tests)
        run: ctest --test-dir build --output-on-failure
      - name: Run simulator and keep log
        run: |
          mkdir -p logs out
          ./build/sdv_sim
          cp logs/latest.csv out/latest.csv
          ./build/sdv_sim --stall brake:2
          cp logs/latest.csv out/cpp_stall_brake2.csv
          ./build/sdv_sim --stall steering:3 --stall brake:3.5
          cp logs/latest.csv out/cpp_stall_steering3_brake3.5.csv
          ./build/sdv_sim --stall engine:1 --stall vehicledynamics:2
          cp logs/latest.csv out/cpp_stall_engine1_vd2.csv
      - uses: actions/upload-artifact@v7
        with:
          name: cpp-sim-log
          path: out/*.csv

  rust-tests:
    name: rust-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/sdv-core
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test (includes C++ golden log cross-check)
        run: cargo test
      - name: cargo test (FOTA campaign against simulated vehicle state)
        run: cargo test --features fota-simulator
      - name: cargo test (FOTA service and Pi 5/Linux backend)
        run: cargo test --manifest-path ../sdv-fota/Cargo.toml
      - name: cargo test (PiCar-X actuator mapping)
        run: cargo test --manifest-path ../sdv-picarx/Cargo.toml
      - name: cargo test (host-only FOTA signing tools)
        run: cargo test --manifest-path ../sdv-fota/Cargo.toml --features host-signing
      - name: cargo check (allocator-free FOTA core)
        run: cargo check --manifest-path ../sdv-fota/Cargo.toml --no-default-features
      - name: C ABI smoke test (Classic FOTA bridge)
        run: ../sdv-fota/tests/c_smoke.sh
      - name: WASM build
        run: cargo build --release --target wasm32-unknown-unknown

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt (all crates)
        run: |
          for crate in sdv-core sdv-sec sdv-fota sdv-picarx; do
            echo "== $crate"
            cargo fmt --manifest-path rust/$crate/Cargo.toml -- --check
          done
      - name: clippy (errors fail the job; warnings are tolerated for now, see CONTRIBUTING.md)
        run: |
          for crate in sdv-core sdv-sec sdv-fota sdv-picarx; do
            echo "== $crate"
            cargo clippy --manifest-path rust/$crate/Cargo.toml --all-targets
          done
          cargo clippy --manifest-path rust/sdv-core/Cargo.toml --all-targets --features fota-simulator

  sec-tests:
    name: sec-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/sdv-sec
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: cargo test (RFC / NIST test vectors, frame MAC, header check)
        run: cargo test --features sign
      - name: no_std build for the browser target (no signing code)
        run: cargo build --release --target wasm32-unknown-unknown
      - name: C ABI smoke test (a C program through the public header)
        run: ./tests/c_smoke.sh

  integration:
    name: integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the WASM artifact
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path rust/sdv-core/Cargo.toml
      - name: Scenario + expectation tests on the built .wasm (Node, no browser)
        run: node tests/integration/run_wasm.mjs

  aarch64:
    name: aarch64
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install the aarch64 cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-binfmt
          # Register aarch64 with binfmt_misc so that the processes the tests spawn (workers, launchers) run too.
          mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc none /proc/sys/fs/binfmt_misc
          sudo /usr/lib/systemd/systemd-binfmt /usr/lib/binfmt.d/qemu-aarch64.conf
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Build for Pi 5 (aarch64-unknown-linux-gnu)
        run: |
          for crate in sdv-sec sdv-core sdv-fota sdv-picarx; do
            cargo build --release --target aarch64-unknown-linux-gnu --manifest-path rust/$crate/Cargo.toml
          done
      - name: Test under qemu-user (sdv-sec, sdv-core)
        run: |
          for crate in sdv-sec sdv-core; do
            cargo test --target aarch64-unknown-linux-gnu --manifest-path rust/$crate/Cargo.toml
          done
      - name: Test sdv-fota under qemu-user
        # Timing under emulation can flake one test now and then. A deterministic failure (an architecture-dependent
        # value such as O_NOFOLLOW, see #174) fails every attempt, so a few attempts keep the signal and drop the noise.
        run: |
          for attempt in 1 2 3; do
            if cargo test --target aarch64-unknown-linux-gnu --manifest-path rust/sdv-fota/Cargo.toml; then exit 0; fi
            echo "::warning::sdv-fota tests failed on attempt $attempt under emulation"
          done
          exit 1
      - name: Build and run the unit tests of sdv-picarx under qemu-user
        # The integration tests spawn worker processes and assert 10 ms cycle deadlines, which emulation does not meet
        # reliably: they are only compiled here (type and ABI errors still show) and run natively in rust-tests.
        run: |
          cargo test --target aarch64-unknown-linux-gnu --manifest-path rust/sdv-picarx/Cargo.toml --lib --bins
          cargo test --target aarch64-unknown-linux-gnu --manifest-path rust/sdv-picarx/Cargo.toml --tests --no-run
      - name: Keep the aarch64 binaries
        uses: actions/upload-artifact@v7
        with:
          name: sdv-aarch64-binaries
          path: |
            rust/sdv-fota/target/aarch64-unknown-linux-gnu/release/sdv-fota
            rust/sdv-fota/target/aarch64-unknown-linux-gnu/release/sdv-fota-launcher
            rust/sdv-picarx/target/aarch64-unknown-linux-gnu/release/sdv-picarx
            rust/sdv-picarx/target/aarch64-unknown-linux-gnu/release/sdv-picarx-ecu-worker
            rust/sdv-picarx/target/aarch64-unknown-linux-gnu/release/sdv-picarx-health

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the WASM and put it where the page loads it from
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path rust/sdv-core/Cargo.toml
          cp rust/sdv-core/target/wasm32-unknown-unknown/release/sdv_core.wasm web/
      - name: Install the test dependencies (playwright-core only; the browser is the Chrome of the runner image)
        working-directory: e2e
        run: npm ci
      - name: Browser smoke tests
        working-directory: e2e
        run: npm test

  golden-log:
    name: golden-log
    needs: cpp-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: cpp-sim-log
          path: out
      - name: C++ log must match committed golden file
        run: |
          status=0
          diff -u rust/sdv-core/tests/golden/cpp_latest.csv out/latest.csv || status=1
          for f in cpp_stall_brake2 cpp_stall_steering3_brake3.5 cpp_stall_engine1_vd2; do
            diff -u rust/sdv-core/tests/golden/$f.csv out/$f.csv || status=1
          done
          if [ $status -ne 0 ]; then
            echo "::error::C++ output changed. If intended, regenerate the golden files in rust/sdv-core/tests/golden (see CONTRIBUTING.md)."
            exit 1
          fi

  # Single stable check to require in branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [cpp-tests, rust-tests, lint, sec-tests, integration, aarch64, e2e, golden-log]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
