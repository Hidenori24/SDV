<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family='"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif' role="img" aria-labelledby="t d"><title id="t">ECU間のアーキテクチャ</title><desc id="d">VCU・3つのECU・Plant が車載バスと直結線でつながる構成。フレーム、周期、故障注入点、フェイルセーフ</desc><defs><marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a_gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="1399" height="959" rx="12" fill="#ffffff" stroke="#d1d5db"/><text x="700.0" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#1f2937" >ECU間のアーキテクチャ</text><text x="700.0" y="66" font-size="14" font-weight="400" text-anchor="middle" fill="#6b7280" >ECU 間は車載バスのフレーム（遅延・欠損・断を注入できる）。Plant とのアクチュエータ線・E-Stop 線は直結で、バス障害の影響を受けない</text><rect x="450" y="100" width="500" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2" /><text x="700.0" y="128" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >VCU / ゲートウェイ ECU</text><text x="700.0" y="152" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >DriverInputSWC（入力）  SafetySupervisorSWC（Watchdog）</text><text x="700.0" y="170" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >RTE(VCU)</text><rect x="150" y="380" width="300" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2" /><text x="300.0" y="408" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >Engine ECU</text><text x="300.0" y="432" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >EngineSWC</text><text x="300.0" y="450" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >RTE(Engine)  ＋ フェイルセーフ</text><rect x="550" y="380" width="300" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2" /><text x="700.0" y="408" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >Brake ECU</text><text x="700.0" y="432" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >BrakeSWC</text><text x="700.0" y="450" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >RTE(Brake)  ＋ フェイルセーフ</text><rect x="950" y="380" width="300" height="100" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.2" /><text x="1100.0" y="408" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >Steering ECU</text><text x="1100.0" y="432" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >SteeringSWC</text><text x="1100.0" y="450" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >RTE(Steering)  ＋ フェイルセーフ</text><rect x="450" y="700" width="500" height="100" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2" /><text x="700.0" y="728" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >Plant（ECUではない・制御対象）</text><text x="700.0" y="752" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >VehicleDynamicsSWC</text><text x="700.0" y="770" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >RTE(Plant)</text><rect x="110" y="270" width="1180" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" /><text x="700.0" y="295" font-size="16" font-weight="700" text-anchor="middle" fill="#166534" >車載バス（CAN風・固定周期フレーム・最新値を保持）</text><path d="M580,200 V270" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_blue)"/><rect x="471.9" y="225.5" width="216.2" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="580" y="238" font-size="12.5" font-weight="400" text-anchor="middle" fill="#1d4ed8" >Safety 10ms・DriverInput 20ms</text><path d="M820,270 V200" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_orange)"/><rect x="719.1" y="225.5" width="201.7" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="820" y="238" font-size="12.5" font-weight="400" text-anchor="middle" fill="#b45309" >Alive ×4・VehicleState 10ms</text><path d="M250.0,308 V380" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_blue)"/><path d="M350.0,380 V308" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_orange)"/><rect x="115.7" y="328.0" width="138.3" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="250.0" y="340" font-size="12" font-weight="400" text-anchor="end" fill="#1d4ed8" >DriverInput・Safety</text><rect x="346.0" y="328.0" width="77.6" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="350.0" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#b45309" >Alive 10ms</text><path d="M650.0,308 V380" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_blue)"/><path d="M750.0,380 V308" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_orange)"/><rect x="515.7" y="328.0" width="138.3" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="650.0" y="340" font-size="12" font-weight="400" text-anchor="end" fill="#1d4ed8" >DriverInput・Safety</text><rect x="746.0" y="328.0" width="77.6" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="750.0" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#b45309" >Alive 10ms</text><path d="M1050.0,308 V380" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_blue)"/><path d="M1150.0,380 V308" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_orange)"/><rect x="915.7" y="328.0" width="138.3" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="1050.0" y="340" font-size="12" font-weight="400" text-anchor="end" fill="#1d4ed8" >DriverInput・Safety</text><rect x="1146.0" y="328.0" width="77.6" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="1150.0" y="340" font-size="12" font-weight="400" text-anchor="start" fill="#b45309" >Alive 10ms</text><path d="M300.0,480 V560 H520 V700" stroke="#374151" stroke-width="4.5" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><rect x="348.8" y="539.0" width="122.3" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="410.0" y="552" font-size="13" font-weight="700" text-anchor="middle" fill="#111827" >CmdDrive（直結）</text><path d="M700.0,480 V700" stroke="#374151" stroke-width="4.5" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><rect x="568.7" y="607.0" width="122.3" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="686.0" y="620" font-size="13" font-weight="700" text-anchor="end" fill="#111827" >CmdBrake（直結）</text><path d="M1100.0,480 V560 H880 V700" stroke="#374151" stroke-width="4.5" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><rect x="928.8" y="539.0" width="122.3" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="990.0" y="552" font-size="13" font-weight="700" text-anchor="middle" fill="#111827" >CmdSteer（直結）</text><path d="M450,150 H50 V750 H450" stroke="#374151" stroke-width="4.5" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><g transform="rotate(-90 50 460)"><rect x="-39.2" y="447.0" width="178.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="50" y="460" font-size="13" font-weight="700" text-anchor="middle" fill="#111827" >Safety（直結・E-Stop線）</text></g><path d="M950,750 H1350 V289.0 H1290" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_orange)"/><g transform="rotate(-90 1350 560)"><rect x="1260.0" y="547.5" width="180.0" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="1350" y="560" font-size="12.5" font-weight="400" text-anchor="middle" fill="#b45309" >VehicleState・Alive 10ms</text></g><circle cx="966" cy="116" r="11" fill="#dc2626"/><text x="966" y="120.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >2</text><circle cx="466" cy="396" r="11" fill="#dc2626"/><text x="466" y="400.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text><circle cx="866" cy="396" r="11" fill="#dc2626"/><text x="866" y="400.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text><circle cx="1266" cy="396" r="11" fill="#dc2626"/><text x="1266" y="400.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text><circle cx="88" cy="289.0" r="11" fill="#dc2626"/><text x="88" y="293.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >3</text><circle cx="966" cy="716" r="11" fill="#dc2626"/><text x="966" y="720.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text><rect x="30" y="818" width="1340" height="112" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1" /><path d="M50,838 H110" stroke="#2563eb" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_blue)"/><text x="122" y="842" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937" >バス: 下り（VCU → 各ECU）</text><path d="M50,864 H110" stroke="#d97706" stroke-width="2.6" fill="none" stroke-linejoin="round" marker-end="url(#a_orange)"/><text x="122" y="868" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937" >バス: 上り（生存・センサ → VCU）</text><path d="M50,890 H110" stroke="#374151" stroke-width="4.5" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><text x="122" y="894" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937" >直結（バス障害の影響なし）</text><circle cx="380" cy="837" r="11" fill="#dc2626"/><text x="380" y="841.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >1</text><text x="398" y="842" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937" >ECU / Plant の停止（stall）: 実行もフレーム送信も止まる → Alive が途絶</text><circle cx="380" cy="863" r="11" fill="#dc2626"/><text x="380" y="867.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >2</text><text x="398" y="868" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937" >VCU の停止: Safety・DriverInput が届かなくなる → 各ECUが自律的にフェイルセーフ</text><circle cx="380" cy="889" r="11" fill="#dc2626"/><text x="380" y="893.5" font-size="13" font-weight="700" text-anchor="middle" fill="#fff" >3</text><text x="398" y="894" font-size="13" font-weight="400" text-anchor="start" fill="#1f2937" >バス障害: 遅延（ms）・欠損（%）・断。フレームが戻れば自動で復帰</text><text x="1010" y="838" font-size="13" font-weight="700" text-anchor="start" fill="#1f2937" >フェイルセーフ（各 ECU）</text><text x="1010" y="859" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >DriverInput 途絶 &gt; 200ms → 入力0扱い</text><text x="1010" y="880" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >Safety 途絶 &gt; 100ms → 自律的に EStop 相当</text><text x="1010" y="901" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >Watchdog（VCU）: Alive 途絶 &gt; 1000ms で「応答なし」</text><text x="1010" y="922" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　1つ → Degraded、2つ以上 → EStop（ラッチ）</text></svg>
