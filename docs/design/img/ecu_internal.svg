<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 722" width="1544" height="722" font-family='"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif' role="img" aria-labelledby="t d"><title id="t">ECUごとの内部アーキテクチャ</title><desc id="d">VCU・Engine ECU・Brake ECU・Steering ECU・Plant それぞれの SWC / Model / RTE / BSW とフレームの送受信</desc><defs><marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a_gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="1543" height="721" rx="12" fill="#ffffff" stroke="#d1d5db"/><text x="772.0" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#1f2937" >ECUごとの内部アーキテクチャ</text><text x="772.0" y="66" font-size="14" font-weight="400" text-anchor="middle" fill="#6b7280" >各ノードは同じ 4 層（SWC・Model・RTE・BSW）を持ち、RTE は ECU ごとに 1 つ。他ノードとはフレームでやり取りする</text><rect x="162" y="80" width="262" height="36" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" /><text x="293.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937" >VCU / ゲートウェイ ECU</text><rect x="436" y="80" width="262" height="36" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" /><text x="567.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937" >Engine ECU</text><rect x="710" y="80" width="262" height="36" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" /><text x="841.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937" >Brake ECU</text><rect x="984" y="80" width="262" height="36" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" /><text x="1115.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937" >Steering ECU</text><rect x="1258" y="80" width="262" height="36" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2" /><text x="1389.0" y="104" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937" >Plant（ECUではない）</text><rect x="24" y="122" width="130" height="92" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.5" /><text x="89.0" y="166.0" font-size="16" font-weight="700" text-anchor="middle" fill="#4a6fa5" >SWC</text><rect x="162" y="122" width="262" height="92" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.2" /><text x="174" y="146.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >DriverInputSWC</text><text x="174" y="163.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　シナリオ → DriverInput（20ms）</text><text x="174" y="181.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >SafetySupervisorSWC</text><text x="174" y="198.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　Watchdog（100ms）</text><rect x="436" y="122" width="262" height="92" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.2" /><text x="448" y="163.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >EngineSWC（10ms）</text><text x="448" y="181.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　throttle → drive_accel_cmd</text><rect x="710" y="122" width="262" height="92" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.2" /><text x="722" y="163.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >BrakeSWC（10ms）</text><text x="722" y="181.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　brake → brake_decel_cmd</text><rect x="984" y="122" width="262" height="92" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.2" /><text x="996" y="154.75" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >SteeringSWC（10ms）</text><text x="996" y="172.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　steer → steer_angle_cmd</text><text x="996" y="189.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　（舵角の状態を保持）</text><rect x="1258" y="122" width="262" height="92" rx="8" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="1.2" /><text x="1270" y="154.75" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >VehicleDynamicsSWC</text><text x="1270" y="172.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　（10ms）</text><text x="1270" y="189.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　縦 → 横 の順に更新</text><rect x="24" y="224" width="130" height="96" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5" /><text x="89.0" y="270.0" font-size="16" font-weight="700" text-anchor="middle" fill="#8b5cf6" >Model</text><rect x="162" y="224" width="262" height="96" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.2" /><text x="174" y="258.75" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >safety_logic</text><text x="174" y="276.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　UpdateHeartbeat</text><text x="174" y="293.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　ComputeSafetyState</text><rect x="436" y="224" width="262" height="96" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.2" /><text x="448" y="267.5" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >engine_model</text><text x="448" y="285.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　ComputeDriveAccel</text><rect x="710" y="224" width="262" height="96" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.2" /><text x="722" y="258.75" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >brake_model</text><text x="722" y="276.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　ComputeBrakeDecel</text><text x="722" y="293.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　（EStop → 最大減速）</text><rect x="984" y="224" width="262" height="96" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.2" /><text x="996" y="250.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >steering_model</text><text x="996" y="267.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　ComputeSteerTarget</text><text x="996" y="285.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　StepSteeringDynamics</text><text x="996" y="302.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　（一次遅れ）</text><rect x="1258" y="224" width="262" height="96" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.2" /><text x="1270" y="250.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937" >vehicledynamics_model</text><text x="1270" y="267.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　StepLongitudinal</text><text x="1270" y="285.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　StepLateral</text><text x="1270" y="302.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >　StepVehicle</text><rect x="24" y="330" width="130" height="78" rx="8" fill="#fff4e0" stroke="#c28a2c" stroke-width="1.5" /><text x="89.0" y="367.0" font-size="16" font-weight="700" text-anchor="middle" fill="#c28a2c" >RTE</text><rect x="162" y="330" width="262" height="78" rx="8" fill="#fff4e0" stroke="#c28a2c" stroke-width="1.2" /><text x="174" y="355.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >input / safety / state</text><text x="174" y="373.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >alive_rx[4]（各ノードの</text><text x="174" y="390.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　生存カウンタ）</text><rect x="436" y="330" width="262" height="78" rx="8" fill="#fff4e0" stroke="#c28a2c" stroke-width="1.2" /><text x="448" y="355.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >input / safety</text><text x="448" y="373.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >cmd.drive_accel_cmd</text><text x="448" y="390.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >rx_age（受信経過）</text><rect x="710" y="330" width="262" height="78" rx="8" fill="#fff4e0" stroke="#c28a2c" stroke-width="1.2" /><text x="722" y="355.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >input / safety</text><text x="722" y="373.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >cmd.brake_decel_cmd</text><text x="722" y="390.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >rx_age（受信経過）</text><rect x="984" y="330" width="262" height="78" rx="8" fill="#fff4e0" stroke="#c28a2c" stroke-width="1.2" /><text x="996" y="355.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >input / safety</text><text x="996" y="373.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >cmd.steer_angle_cmd</text><text x="996" y="390.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >rx_age（受信経過）</text><rect x="1258" y="330" width="262" height="78" rx="8" fill="#fff4e0" stroke="#c28a2c" stroke-width="1.2" /><text x="1270" y="355.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >cmd（3つ）/ safety</text><text x="1270" y="373.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >state（t, x, y, yaw,</text><text x="1270" y="390.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　v, yaw_rate, wheel_omega）</text><rect x="24" y="418" width="130" height="78" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.5" /><text x="89.0" y="455.0" font-size="16" font-weight="700" text-anchor="middle" fill="#3d8b5a" >BSW</text><rect x="162" y="418" width="262" height="78" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.2" /><text x="174" y="443.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Com: Safety・DriverInput を送信</text><text x="174" y="461.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　Alive・VehicleState を受信</text><text x="174" y="478.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Diag: 無応答時間を数える</text><rect x="436" y="418" width="262" height="78" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.2" /><text x="448" y="443.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Failsafe: 入力途絶 → 入力0</text><text x="448" y="461.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　Safety途絶 → 自律EStop</text><text x="448" y="478.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Diag: ReportAlive</text><rect x="710" y="418" width="262" height="78" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.2" /><text x="722" y="443.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Failsafe: 入力途絶 → 入力0</text><text x="722" y="461.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　Safety途絶 → 自律EStop</text><text x="722" y="478.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Diag: ReportAlive</text><rect x="984" y="418" width="262" height="78" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.2" /><text x="996" y="443.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Failsafe: 入力途絶 → 入力0</text><text x="996" y="461.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　Safety途絶 → 自律EStop</text><text x="996" y="478.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Diag: ReportAlive</text><rect x="1258" y="418" width="262" height="78" rx="8" fill="#e6f4ea" stroke="#3d8b5a" stroke-width="1.2" /><text x="1270" y="443.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >（ECUではないので</text><text x="1270" y="461.25" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >　フェイルセーフなし）</text><text x="1270" y="478.75" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Diag: ReportAlive</text><rect x="24" y="506" width="130" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="89.0" y="535.0" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b" >受信</text><rect x="162" y="506" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="174" y="532.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Alive ×4（10ms）</text><text x="174" y="550.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >VehicleState（10ms）</text><rect x="436" y="506" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="448" y="532.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >DriverInput（20ms）</text><text x="448" y="550.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Safety（10ms）</text><rect x="710" y="506" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="722" y="532.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >DriverInput（20ms）</text><text x="722" y="550.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Safety（10ms）</text><rect x="984" y="506" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="996" y="532.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >DriverInput（20ms）</text><text x="996" y="550.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Safety（10ms）</text><rect x="1258" y="506" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="1270" y="532.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Cmd ×3（直結）</text><text x="1270" y="550.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Safety（直結）</text><rect x="24" y="578" width="130" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" /><text x="89.0" y="607.0" font-size="16" font-weight="700" text-anchor="middle" fill="#64748b" >送信</text><rect x="162" y="578" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="174" y="604.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Safety（10ms）</text><text x="174" y="622.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >DriverInput（20ms）</text><rect x="436" y="578" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="448" y="604.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >CmdDrive（直結 → Plant）</text><text x="448" y="622.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Alive（10ms）</text><rect x="710" y="578" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="722" y="604.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >CmdBrake（直結 → Plant）</text><text x="722" y="622.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Alive（10ms）</text><rect x="984" y="578" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="996" y="604.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >CmdSteer（直結 → Plant）</text><text x="996" y="622.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Alive（10ms）</text><rect x="1258" y="578" width="262" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" /><text x="1270" y="604.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >VehicleState（10ms）</text><text x="1270" y="622.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#1f2937" >Alive（10ms）</text><text x="24" y="664" font-size="13" font-weight="700" text-anchor="start" fill="#6b7280" >読み方</text><text x="80" y="664" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280" >SWC は渡された RTE だけを読み書きする（他ノードの内部は見ない）／ ECU 間は「受信 → RTE」「RTE → 送信」だけでつながる／ 直結はバス障害（遅延・欠損・断）の影響を受けない</text><text x="80" y="686" font-size="13" font-weight="400" text-anchor="start" fill="#6b7280" >Failsafe: DriverInput が 200ms 超途絶 → 入力を0扱い、Safety が 100ms 超途絶 → そのECUが自律的にEStop相当（フレームが戻れば自動復帰）</text></svg>
