<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1010" width="1480" height="1010" font-family='"Hiragino Sans","Noto Sans CJK JP","Noto Sans JP","Yu Gothic","Meiryo",sans-serif' role="img" aria-labelledby="t d"><title id="t">C++ と Rust の関係</title><desc id="d">C++ の参照実装と Rust 実装のモジュール対応、Rust だけにあるもの、基準ログによる照合</desc><defs><marker id="a_blue" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="a_orange" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="a_dark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="a_red" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="a_green" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="a_gray" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="1479" height="1009" rx="12" fill="#ffffff" stroke="#d1d5db"/><text x="740.0" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#1f2937" >C++ と Rust の関係</text><text x="740.0" y="66" font-size="14" font-weight="400" text-anchor="middle" fill="#6b7280" >C++ は参照実装（基準ログの生成元）、Rust が主役。同じ式・同じ判定を移植し、出力が一致することを CI で確認する</text><rect x="40" y="84" width="520" height="38" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" /><text x="300.0" y="109" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >C++（参照実装）  src/</text><rect x="920" y="84" width="520" height="38" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" /><text x="1180.0" y="109" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2937" >Rust（主役）  rust/sdv-core/src/</text><rect x="40" y="140" width="520" height="66" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" /><text x="54" y="165" font-size="14.5" font-weight="700" text-anchor="start" fill="#0369a1" >model/*.h</text><text x="54" y="182" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >純粋関数（engine・brake・steering・</text><text x="54" y="197" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >vehicledynamics・safety_logic）</text><rect x="920" y="140" width="520" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" /><text x="934" y="165" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >model.rs</text><text x="934" y="182" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >同じ式を f32 で移植</text><text x="934" y="197" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >（steering は厳密離散化）</text><path d="M566,173.0 H914" stroke="#6b7280" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a_gray)" marker-start="url(#a_gray)"/><rect x="685.0" y="152.5" width="110.0" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="740.0" y="165.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#374151" >同じ式・同じ判定</text><rect x="40" y="220" width="520" height="66" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" /><text x="54" y="245" font-size="14.5" font-weight="700" text-anchor="start" fill="#0369a1" >swc/*.cpp</text><text x="54" y="265" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >各 SWC。Model を呼ぶだけ</text><rect x="920" y="220" width="520" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" /><text x="934" y="245" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >swc.rs</text><text x="934" y="265" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >各 SWC。渡された Rte だけを読み書き</text><path d="M566,253.0 H914" stroke="#6b7280" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a_gray)" marker-start="url(#a_gray)"/><rect x="691.9" y="232.5" width="96.2" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="740.0" y="245.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#374151" >同じ SWC 構成</text><rect x="40" y="300" width="520" height="66" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" /><text x="54" y="325" font-size="14.5" font-weight="700" text-anchor="start" fill="#0369a1" >rte/</text><text x="54" y="342" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >RTE はグローバルに 1 つ</text><text x="54" y="357" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >（全 SWC で共有）</text><rect x="920" y="300" width="520" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" /><text x="934" y="325" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >rte.rs</text><text x="934" y="342" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >RTE は ECU ごとに 1 つ</text><text x="934" y="357" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >（信号の中身は同じ）</text><path d="M566,333.0 H914" stroke="#6b7280" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a_gray)" marker-start="url(#a_gray)"/><rect x="685.0" y="312.5" width="110.0" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="740.0" y="325.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#374151" >信号の中身は同じ</text><rect x="40" y="380" width="520" height="66" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" /><text x="54" y="405" font-size="14.5" font-weight="700" text-anchor="start" fill="#0369a1" >bsw/diag + swc/safety_swc.cpp</text><text x="54" y="425" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >生存カウンタ・Watchdog</text><rect x="920" y="380" width="520" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" /><text x="934" y="405" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >safety.rs + model.rs</text><text x="934" y="422" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >同じ判定: 1つ → Degraded、</text><text x="934" y="437" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >2つ以上 → EStop（ラッチ）</text><path d="M566,413.0 H914" stroke="#6b7280" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a_gray)" marker-start="url(#a_gray)"/><rect x="666.2" y="392.5" width="147.5" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="740.0" y="405.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#374151" >同じ判定・同じしきい値</text><rect x="40" y="460" width="520" height="66" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" /><text x="54" y="485" font-size="14.5" font-weight="700" text-anchor="start" fill="#0369a1" >app/main.cpp + bsw/timebase</text><text x="54" y="502" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >10/20/100ms のタスク順序</text><text x="54" y="517" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >sdv_sim --stall で故障注入</text><rect x="920" y="460" width="520" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" /><text x="934" y="485" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >sim.rs</text><text x="934" y="502" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >1ティックの順序（ECU 分割）</text><text x="934" y="517" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >API / シナリオで故障注入</text><path d="M566,493.0 H914" stroke="#6b7280" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a_gray)" marker-start="url(#a_gray)"/><rect x="627.8" y="472.5" width="224.5" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="740.0" y="485.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#374151" >遅延0・欠損0で同じ値が同じティック</text><rect x="40" y="540" width="520" height="66" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5" /><text x="54" y="565" font-size="14.5" font-weight="700" text-anchor="start" fill="#0369a1" >bsw/logging</text><text x="54" y="585" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >CSV を出力（logs/latest.csv）</text><rect x="920" y="540" width="520" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" /><text x="934" y="565" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >sim.rs の Row::to_csv</text><text x="934" y="585" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >同じ列・同じ書式</text><path d="M566,573.0 H914" stroke="#6b7280" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a_gray)" marker-start="url(#a_gray)"/><rect x="708.0" y="552.5" width="64.0" height="18.5" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="740.0" y="565.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#374151" >同じ CSV</text><rect x="40" y="624" width="520" height="112" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 4" /><text x="54" y="650" font-size="14.5" font-weight="700" text-anchor="start" fill="#6b7280" >C++ だけ</text><text x="54" y="674" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >1 プロセス・1 つの RTE（ECU もバスもない）</text><text x="54" y="692" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >内蔵のデモシナリオ（外部化なし）</text><text x="54" y="710" font-size="12.5" font-weight="400" text-anchor="start" fill="#6b7280" >Config / NVM なし（パラメータは定数）</text><rect x="920" y="624" width="520" height="112" rx="8" fill="#fffaf5" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 4" /><text x="934" y="650" font-size="14.5" font-weight="700" text-anchor="start" fill="#c2410c" >Rust だけ</text><rect x="934" y="664" width="160" height="28" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1" /><text x="942" y="682" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >bus.rs  仮想バス</text><rect x="1102" y="664" width="160" height="28" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1" /><text x="1110" y="682" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >failsafe.rs  フェイルセーフ</text><rect x="1270" y="664" width="160" height="28" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1" /><text x="1278" y="682" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >config.rs  Config（JSON）</text><rect x="934" y="697" width="160" height="28" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1" /><text x="942" y="715" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >nvm.rs  疑似NVM</text><rect x="1102" y="697" width="160" height="28" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1" /><text x="1110" y="715" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >scenario.rs  シナリオ（JSON）</text><rect x="1270" y="697" width="160" height="28" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1" /><text x="1278" y="715" font-size="11.5" font-weight="400" text-anchor="start" fill="#1f2937" >lib.rs  C ABI（WASM）</text><rect x="30" y="764" width="1420" height="232" rx="10" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.2" /><text x="50" y="792" font-size="15.5" font-weight="700" text-anchor="start" fill="#1f2937" >基準ログによる照合（CI で毎回確認）</text><rect x="60" y="834" width="360" height="90" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" /><text x="240" y="864" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937" >C++ sdv_sim を実行</text><text x="240" y="888" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280" >通常 ・ --stall brake:2</text><text x="240" y="903" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280" >--stall steering:3 --stall brake:3.5</text><text x="240" y="918" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280" >--stall engine:1 --stall vehicledynamics:2</text><rect x="530" y="834" width="420" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2" /><text x="740" y="866" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2937" >基準ログ（golden）</text><text x="740" y="890" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >rust/sdv-core/tests/golden/*.csv</text><text x="740" y="907" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >4 本・各 10 秒・1000 行</text><rect x="1060" y="834" width="360" height="90" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" /><text x="1240" y="864" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2937" >Rust が同じ走行を再現</text><text x="1240" y="888" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280" >Sim をシナリオ JSON（イベント付き）や</text><text x="1240" y="905" font-size="12" font-weight="400" text-anchor="middle" fill="#6b7280" >API で動かし、ログ行を生成</text><path d="M420,879 H520" stroke="#374151" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><path d="M1050,879 H960" stroke="#374151" stroke-width="3" fill="none" stroke-linejoin="round" marker-end="url(#a_dark)"/><rect x="416.3" y="900.0" width="107.4" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="470" y="912" font-size="12" font-weight="700" text-anchor="middle" fill="#111827" >CI: golden-log</text><rect x="965.2" y="900.0" width="79.6" height="18" rx="3" fill="#ffffff" fill-opacity="0.92"/><text x="1005" y="912" font-size="12" font-weight="700" text-anchor="middle" fill="#111827" >cargo test</text><text x="470" y="952" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >C++ の出力 == golden</text><text x="1005" y="952" font-size="12.5" font-weight="400" text-anchor="middle" fill="#6b7280" >Rust の出力 == golden（全行一致）</text><text x="740.0" y="984" font-size="13" font-weight="400" text-anchor="middle" fill="#6b7280" >C++ の挙動を変えたら golden を更新し、Rust も合わせる（手順は CONTRIBUTING.md）。ずれると CI が落ちる</text></svg>
