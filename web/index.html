<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDV Simulator</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1d2330; --sub:#6b7385; --line:#dfe3ea;
  --accent:#2563eb; --danger:#dc2626; --ok:#16a34a; --grid:#e6e9ef; --car:#2563eb; --trail:#93b4f5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a; --panel:#171c26; --ink:#e6e9f0; --sub:#8e97aa; --line:#272e3b;
    --accent:#5b8def; --danger:#ef4444; --ok:#34d399; --grid:#1f2531; --car:#5b8def; --trail:#2f4a85;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans",sans-serif}
header{display:flex;align-items:baseline;gap:12px;padding:12px 16px}
header h1{margin:0;font-size:18px}
header span{color:var(--sub);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:0 16px 16px;max-width:1200px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
canvas{display:block;width:100%;border-radius:6px}
#view{height:360px;background:var(--bg)}
#chart{height:120px;margin-top:8px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row label{width:76px;color:var(--sub)}
.row input[type=range]{flex:1}
.row output{width:48px;text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.estop{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700;flex:1}
button.estop.on{outline:3px solid color-mix(in srgb,var(--danger) 40%,transparent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:2px 0}
.stats dt{color:var(--sub)}.stats dd{margin:0;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:0 8px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--ok)}
.badge.estop{background:var(--danger)}
h2{font-size:13px;margin:0 0 4px;color:var(--sub);font-weight:600}
.hint{color:var(--sub);font-size:12px;margin-top:8px}
#err{display:none;color:var(--danger);padding:0 16px}
</style>
</head>
<body>
<header><h1>SDV Simulator</h1><span>Rust(WASM) Model層 · 10ms固定ステップ · C++実装と同一ログ</span></header>
<div id="err"></div>
<main>
  <section class="card">
    <canvas id="view"></canvas>
    <canvas id="chart"></canvas>
    <p class="hint">キー操作: ↑/W=アクセル ↓/S=ブレーキ ←→/A,D=ステア Space=E-Stop。キー入力はスライダーに反映されます。</p>
  </section>
  <aside class="card">
    <h2>ドライバー入力</h2>
    <div class="row"><label for="thr">Throttle</label><input id="thr" type="range" min="0" max="1" step="0.01" value="0"><output id="thrO">0.00</output></div>
    <div class="row"><label for="brk">Brake</label><input id="brk" type="range" min="0" max="1" step="0.01" value="0"><output id="brkO">0.00</output></div>
    <div class="row"><label for="str">Steer</label><input id="str" type="range" min="-1" max="1" step="0.01" value="0"><output id="strO">0.00</output></div>
    <div class="btns">
      <button id="estop" class="estop">E-STOP</button>
      <button id="scn">デモシナリオ</button>
      <button id="reset">リセット</button>
      <button id="pause">一時停止</button>
    </div>
    <div class="row"><label for="spd">再生速度</label><input id="spd" type="range" min="0.25" max="4" step="0.25" value="1"><output id="spdO">1.0x</output></div>
    <h2 style="margin-top:12px">状態 <span id="state" class="badge">Normal</span></h2>
    <dl class="stats">
      <div><dt>t</dt><dd id="s_t">0</dd></div><div><dt>v [m/s]</dt><dd id="s_v">0</dd></div>
      <div><dt>x [m]</dt><dd id="s_x">0</dd></div><div><dt>y [m]</dt><dd id="s_y">0</dd></div>
      <div><dt>yaw [deg]</dt><dd id="s_yaw">0</dd></div><div><dt>yaw rate [deg/s]</dt><dd id="s_yr">0</dd></div>
      <div><dt>wheel [rad/s]</dt><dd id="s_w">0</dd></div><div><dt>steer cmd [deg]</dt><dd id="s_sc">0</dd></div>
      <div><dt>accel cmd</dt><dd id="s_ac">0</dd></div><div><dt>decel cmd</dt><dd id="s_dc">0</dd></div>
    </dl>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
