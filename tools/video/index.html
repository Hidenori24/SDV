for(const k in NODES){const [x,y,z,c]=NODES[k];const m=new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(2.4),transparent:true,opacity:0});
 const b=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.14,0.34),m);b.position.set(x,y,z);car.add(b);nodeObj[k]=b;nodeMats.push(m)}

{const p=[];const v=NODES.VCU;for(const k of ['ENG','BRK','STR']){const n=NODES[k];p.push(v[0],v[1],v[2],v[0],v[1],n[2],v[0],v[1],n[2],n[0],n[1],n[2])}
 for(const [x,z] of [[-0.82,-1.38],[0.82,-1.38]]){p.push(0,0.66,-1.5,x,0.36,z)} for(const [x,z] of [[-0.82,1.32],[0.82,1.32]]){p.push(0,0.62,1.35,x,0.36,z)}

const CK=[
 [0,   -1.0,0.6,-14,  0,0.9,0,   300],
 [3.5, -3.0,1.0,-8.5,  0,0.8,0,   400],

function camAt(t){let i=0;while(i<CK.length-2&&t>CK[i+1][0])i++;const a=CK[i],b=CK[i+1];const k=ss((t-a[0])/(b[0]-a[0]));const o=[];for(let j=1;j<8;j++)o.push(lerp(a[j],b[j],k));return o}

/* motion: distance integrated per frame grid for determinism */
const stall=GOLDEN.stall,demo=GOLDEN.demo; // rows: t,x,y,yaw,v,thr,brk,steer,state,estop (every 20ms)
const rowAt=(arr,tt)=>arr[clamp(Math.round(tt/0.02)-1,0,arr.length-1)];
const SAFE=scn('safe');
// log time during safety scene: 2.4s → 6.4s
const logT=t=>lerp(2.4,6.4,clamp((t-SAFE.s-1.2)/(SAFE.e-SAFE.s-3.0)));
function speedAt(t){ // m/s of the 3D car
 const cruise=17;
 if(t<SAFE.s) return cruise;
 if(t<SAFE.e){const v=rowAt(stall,logT(t))[4];const base=v/2.27*cruise;return lerp(cruise,base,A(t,SAFE.s,1.2))}
 return lerp(0,cruise,ss((t-SAFE.e)/3));
}
const DIST=[];{let s=0;for(let f=0;f<=window.DURATION*30+2;f++){DIST.push(s);s+=speedAt(f/30)/30}}
function xray(t){ // 0 solid … 1 full x-ray
 const k=[[0,0],[2.6,0],[5,0.55],[7,0.6],[9,1],[27,1],[29,0.45],[38,0.45],[40,0.25],[48,0.25],[50,0.7],[60,0.7],[62,0.35],[75,0.3],[78,0],[82,0]];
 let i=0;while(i<k.length-2&&t>k[i+1][0])i++;return lerp(k[i][1],k[i+1][1],ss((t-k[i][0])/(k[i+1][0]-k[i][0])))}

const V3=new THREE.Vector3();
function proj(obj){obj.getWorldPosition(V3);V3.project(camera);return [(V3.x*0.5+0.5)*W,(-V3.y*0.5+0.5)*H]}

function update3D(t){
 const f=Math.min(DIST.length-1,Math.round(t*30));const s=DIST[f];
 rt.offset.y=(s/16)%1;                     // texture tile = 480/30 = 16m
 for(const p of posts){p.position.z=((p.userData.i*SP+s)%(NP*SP))-NP*SP+40}
 grid.position.z=(s%2)-120;
 for(const w of wheels)w.rotation.x=-s/0.36;
 const st=(t>=SAFE.s&&t<SAFE.e)?rowAt(stall,logT(t)):null;
 const steer=st?st[7]*0.35:Math.sin(t*0.5)*0.03;wheels[0].rotation.y=wheels[1].rotation.y=steer;
 car.position.x=Math.sin(t*0.37)*0.12;car.position.z=-46*ss((t-63.5)/11);car.rotation.y=Math.cos(t*0.37)*0.004;car.position.y=Math.sin(t*9.1)*0.003;
 const xr=xray(t);
 paint.opacity=1-0.82*xr;glass.opacity=0.92-0.7*xr;tireM.opacity=rimM.opacity=1-0.6*xr;
 paint.depthWrite=xr<0.3;glass.depthWrite=xr<0.3;
 edgeMat.opacity=0.95*Math.min(1,xr*1.6);
 for(const m of nodeMats)m.opacity=clamp(xr*1.5-0.15)*(0.75+0.25*Math.sin(t*6.28*1.0));
 busMat.opacity=clamp(xr*1.5-0.15)*0.9;
 grid.material.opacity=0.05+0.13*xr;
 // scan sweep 2.6→5.0
 const sk=clamp((t-2.6)/2.4);scan.material.opacity=(t>2.6&&t<5.0)?0.045*Math.sin(sk*Math.PI):0;scan.position.z=lerp(-2.4,2.4,sk);
 // safety state
 const state=st?st[8]:0;const es=state===2;
 alarm.intensity=es?12*(0.6+0.4*Math.sin(t*14)):(state===1?10:0);alarm.color.set(es?0xff2010:0xffa020);
 tlM.color.set(0xff1a1a).multiplyScalar(es||(st&&st[6]>0)?7:2.5);tailL.intensity=es?14:6;
 // dawn
 const F=scn('future');const dk=ss((t-F.s-1)/9);
 scene.background.copy(NIGHT).lerp(DAWN,dk*0.75);scene.fog.color.copy(scene.background);scene.fog.density=lerp(0.018,0.008,dk);
 hemi.intensity=lerp(0.5,1.5,dk);hemi.color.set(0x4060a0).lerp(new THREE.Color(0xc090b0),dk);
 glow.material.uniforms.k.value=dk;stars.material.opacity=0.8*(1-dk*0.8);
 moon.color.set(0x9fb8ff).lerp(new THREE.Color(0xffb890),dk);
 const c=camAt(t);camera.position.set(c[0],c[1],c[2]);camera.lookAt(c[3],c[4],c[5]);
 if(Math.abs(c[6])>1)camera.setViewOffset(W,H,-c[6],0,W,H);else camera.clearViewOffset();
 camera.updateProjectionMatrix();camera.updateMatrixWorld();car.updateMatrixWorld(true);
 composer.render();
 return {s,state,v:speedAt(t),xr,st};
}
