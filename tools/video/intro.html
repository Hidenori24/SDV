function loft(nS,nR,fn){const pos=[],idx=[];

const stall=GOLDEN.stall,demo=GOLDEN.demo;   // 行: t,x,y,yaw,v,throttle,brake,steer,state,estop（20 ms ごと）

function speedAt(t){const cruise=17;
 if(t<SAFE.s)return cruise;
